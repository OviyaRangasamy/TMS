<section class="user-list" aria-labelledby="user-list-title">
  <header class="page-heading">
    <div>
      <p class="eyebrow">Administration</p>
      <h1 id="user-list-title">Users</h1>
      <p class="subtitle">Manage user roles across your team.</p>
    </div>
  </header>

  @if (loading()) {
    <p class="message" role="status">Loading users…</p>
  } @else if (errorMessage(); as message) {
    <p class="message error" role="alert">{{ message }}</p>
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="users()" aria-label="Users">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let user">{{ user.name }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let user">
            <mat-form-field appearance="outline" subscriptSizing="dynamic">
              <mat-select
                [value]="user.role"
                [disabled]="updatingUserIds().has(user.id)"
                [aria-label]="'Role for ' + user.name"
                (selectionChange)="updateRole(user, $event.value)"
              >
                @for (role of roles; track role) {
                  <mat-option [value]="role">{{ role }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell empty-state" colspan="3">No users found.</td>
        </tr>
      </table>
    </div>
  }
</section>
